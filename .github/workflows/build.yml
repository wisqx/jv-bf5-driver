name: Build Driver
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1
      
    - name: Compile Driver
      run: |
        # Ищем установленный WDK в системе
        $wdkPath = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" -Directory | Select-Object -Last 1).FullName
        $kmPath = "$wdkPath\km"
        $sharedPath = "$wdkPath\shared"
        $libPath = "$wdkPath\..\..\Lib\$(Split-Path $wdkPath -Leaf)\km\x64"
        
        echo "Using WDK: $wdkPath"
        cl /nologo /TC /GS- /Gs- /O2 /D_AMD64_ /D_WIN64_ /c /Fo:jv_driver.obj /I"$kmPath" /I"$sharedPath" jv_driver.c
        link /nologo /DRIVER /SUBSYSTEM:NATIVE /OUT:jv_driver.sys jv_driver.obj /LIBPATH:"$libPath" ntoskrnl.lib hal.lib BufferOverflowK.lib
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: jv_driver_sys
        path: jv_driver.sys
