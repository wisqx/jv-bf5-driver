name: Build Driver
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install WDK
      run: |
        winget install --id Microsoft.WindowsWDK.10.0.26100 `
          --accept-package-agreements `
          --accept-source-agreements `
          --silent

    - name: Setup MSVC Environment
      uses: ilammy/msvc-dev-cmd@v1

    - name: Compile Driver
      run: |
        $wdkVer = "10.0.26100.0"
        $wdkRoot = "C:\Program Files (x86)\Windows Kits\10"
        $incPath = "$wdkRoot\Include\$wdkVer"
        $libPath = "$wdkRoot\Lib\$wdkVer\km\x64"
        
        echo "Using WDK version: $wdkVer"
        
        # Ищем все папки в проекте и добавляем их в пути поиска (чтобы наверняка найти shared.h)
        $localIncludes = ""
        Get-ChildItem -Directory -Recurse | ForEach-Object { $localIncludes += " /I`"$($_.FullName)`" " }
        
        echo "Compiling..."
        
        # Запускаем компиляцию с учетом всех найденных папок
        cl /nologo /TC /GS- /Gs9999999 /O2 /D_AMD64_ /D_WIN64_ /DUNICODE /D_UNICODE `
           /c /Fo:jv_driver.obj `
           $localIncludes `
           /I"$incPath\km" /I"$incPath\shared" /I"$incPath\ucrt" `
           jv_driver.c
        if ($LASTEXITCODE -ne 0) { throw "Compilation failed" }

        link /nologo /DRIVER /SUBSYSTEM:NATIVE /MACHINE:X64 /ENTRY:DriverEntry `
             /OUT:jv_driver.sys `
             jv_driver.obj `
             /LIBPATH:"$libPath" ntoskrnl.lib hal.lib BufferOverflowK.lib wdmsec.lib
        if ($LASTEXITCODE -ne 0) { throw "Linkage failed" }

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: jv_driver_sys
        path: jv_driver.sys
